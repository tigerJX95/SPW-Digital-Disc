name: Build release plugin

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: release-${{ github.event.release.id }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and attach spmod
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name }}
    steps:
      - name: Check out the released source
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.release.tag_name }}
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'

      - name: Set up Gradle 9.8
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.0'

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Check release version
        shell: python
        run: |
          import os, re
          from pathlib import Path
          tag = os.environ["RELEASE_TAG"]
          if not re.fullmatch(r"[Vv][0-9]+\.[0-9]+\.[0-9]+", tag):
              raise SystemExit("Use a release tag such as V1.0.0.")
          version = tag[1:]
          manifest = Path("MANIFEST.MF").read_text(encoding="utf-8")
          gradle = Path("build.gradle").read_text(encoding="utf-8")
          mv = re.search(r"^Plugin-Version: (.+)$", manifest, re.M)
          gv = re.search(r"""^version\s*=\s*['"]([^'"]+)['"]""", gradle, re.M)
          if not mv or not gv or mv[1].strip() != version or gv[1] != version:
              raise SystemExit("Tag, MANIFEST.MF Plugin-Version and build.gradle version must match.")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as out:
              out.write(f"PLUGIN_VERSION={version}\n")

      - name: Download matching SPW host
        shell: python
        env:
          SPW_HOST_ARCHIVE_URL: ${{ secrets.SPW_HOST_ARCHIVE_URL }}
        run: |
          import os, urllib.request, urllib.parse
          from pathlib import Path
          url = os.environ.get("SPW_HOST_ARCHIVE_URL", "").strip()
          if not url:
              raise SystemExit("Configure repository Actions secret SPW_HOST_ARCHIVE_URL with an HTTPS direct download of the matching SPW 1.19.0 MS app/ffmpeg-x64.dll.")
          if urllib.parse.urlsplit(url).scheme != "https":
              raise SystemExit("SPW_HOST_ARCHIVE_URL must use HTTPS.")
          target = Path(os.environ["RUNNER_TEMP"]) / "spw-host" / "ffmpeg-x64.dll"
          target.parent.mkdir(parents=True, exist_ok=True)
          try:
              request = urllib.request.Request(url, headers={"User-Agent": "SPW-Digital-Disc-build"})
              with urllib.request.urlopen(request, timeout=60) as response, target.open("wb") as output:
                  if urllib.parse.urlsplit(response.url).scheme != "https":
                      raise ValueError("Insecure redirect")
                  size = 0
                  while chunk := response.read(1024 * 1024):
                      size += len(chunk)
                      if size > 256 * 1024 * 1024:
                          raise ValueError("Host download exceeds 256 MiB")
                      output.write(chunk)
              if not size:
                  raise ValueError("Empty download")
          except Exception:
              target.unlink(missing_ok=True)
              raise SystemExit("Host download failed. Check the secret URL, its expiry and direct-download permissions.")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as output:
              output.write(f"SPW_HOST_ARCHIVE={target}\n")

      - name: Compile and package
        shell: bash
        run: gradle --no-daemon "-PsaltPlayerArchive=$SPW_HOST_ARCHIVE" clean plugin

      - name: Check packaged version
        shell: python
        run: |
          import os, zipfile
          from pathlib import Path
          version = os.environ["PLUGIN_VERSION"]
          package = Path("dist") / f"SPW_Digital_Disc_V{version}.spmod"
          with zipfile.ZipFile(package) as archive:
              if archive.testzip() is not None:
                  raise SystemExit("Damaged plugin archive.")
              manifest = archive.read("classes/META-INF/MANIFEST.MF").decode("utf-8")
              if f"Plugin-Version: {version}" not in manifest.splitlines():
                  raise SystemExit("Packaged plugin version differs from the release tag.")
              archive.getinfo("classes/io/github/tigerjx95/spwcdprobe/CdPageProbePlugin.class")
          print(f"Built {package}")

      - name: Attach plugin to the published release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release upload "$RELEASE_TAG" "dist/SPW_Digital_Disc_V${PLUGIN_VERSION}.spmod"
